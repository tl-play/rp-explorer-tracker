<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RP / Explorer — Feedback Delivery Tracker</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1a1f2b;--muted:#616a78;--line:#e4e7ee;
    --plan:#8a94a6;--scope:#7c5cff;--prog:#2f80ed;--review:#e6892b;--done:#27ae60;--gap:#c0392b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;line-height:1.45}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 18px 50px}
  h1{margin:0;font-size:19px}
  .meta{color:var(--muted);font-size:12px;margin:3px 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff}
  .s-planning{background:var(--plan)}.s-scoping{background:var(--scope)}.s-in_progress{background:var(--prog)}
  .s-in_review{background:var(--review)}.s-delivered{background:var(--done)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 14px}
  select,input{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px}
  input#q{min-width:200px}
  .controls label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:8px 10px;vertical-align:top;border-bottom:1px solid var(--line)}
  th{background:#f0f2f6;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#4a5361;position:sticky;top:0}
  td.id{font-weight:700;color:var(--muted);white-space:nowrap}
  .askrow td{background:#eef1fb;border-top:2px solid #d7dcf3}
  .askrow .at{font-weight:700;font-size:13px}
  .askrow .pb{color:#40506e;font-size:12px;margin-top:2px}
  .askrow .pb u{text-decoration-color:#b9a9ff;text-decoration-thickness:2px;text-underline-offset:2px}
  .itemname{font-weight:650}
  .sub{color:var(--muted);font-size:12px}
  a.tkt{display:inline-block;font-size:11px;font-weight:700;text-decoration:none;color:#2f6fed;
    background:#eaf1ff;border:1px solid #d6e3ff;padding:1px 6px;border-radius:5px;margin:0 3px 3px 0}
  a.tkt:hover{background:#dbe8ff}
  .gap{color:var(--gap);font-style:italic;font-size:11px;font-weight:600}
  td.oq{color:#7a5a12}
  td.dep{color:#6b4a80}
  footer{color:var(--muted);font-size:11px;margin-top:14px;text-align:center}
  @media(max-width:820px){td.dep,th.dep{display:none}}
  #gate{position:fixed;inset:0;background:linear-gradient(160deg,#eef1fb,#f5f6f8);display:flex;align-items:center;justify-content:center;z-index:99}
  #gate .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 26px;width:340px;max-width:92vw;box-shadow:0 8px 30px rgba(20,30,50,.12)}
  #gate h2{margin:0 0 4px;font-size:17px}
  #gate p{margin:0 0 16px;color:var(--muted);font-size:12px}
  #gate input{width:100%;padding:9px 11px;font-size:14px;margin-bottom:10px}
  #gate button{width:100%;padding:9px;border:0;border-radius:8px;background:#2f6fed;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  #gate button:hover{background:#2860d8}
  #err{color:var(--gap);font-size:12px;min-height:16px;margin-top:6px;font-weight:600}
  #app{display:none}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h2>Protected dashboard</h2>
    <p>RP / Explorer Feedback Delivery Tracker. Enter the password to view.</p>
    <input id="pw" type="password" placeholder="Password" autofocus autocomplete="off"/>
    <button id="go">Unlock</button>
    <div id="err"></div>
  </div>
</div>

<div id="app" class="wrap">
  <h1>RP / Explorer — Feedback Delivery Tracker</h1>
  <div class="meta" id="meta"></div>
  <div class="chips" id="chips"></div>
  <div class="controls">
    <label>Status</label><select id="fs"><option value="all">All</option></select>
    <label>Ask</label><select id="fa"><option value="all">All</option></select>
    <input id="q" placeholder="Search text / ticket…"/>
  </div>
  <table>
    <thead><tr>
      <th>Item</th><th>Scope</th><th>Status</th><th>Jira</th>
      <th class="dep">Dependencies</th><th>Open question</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <footer id="foot"></footer>
</div>

<script>
const ENC=__ENC__;
const L={planning:"Planning",scoping:"Scoping",in_progress:"In Progress",in_review:"In Review",delivered:"Delivered"};
const ORD=["planning","scoping","in_progress","in_review","delivered"];
const JB="https://jira.frontiersin.net/browse/";
let DATA=null;

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function unlock(){
  const pw=document.getElementById("pw").value;
  const err=document.getElementById("err");err.textContent="";
  try{
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},
      km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
    DATA=JSON.parse(new TextDecoder().decode(pt));
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="block";
    init();
  }catch(e){err.textContent="Incorrect password.";}
}
document.getElementById("go").onclick=unlock;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});

function pill(s){return '<span class="pill s-'+s+'">'+L[s]+'</span>';}
function tkts(a){return a.length?a.map(t=>'<a class="tkt" target="_blank" href="'+JB+t+'">'+t+'</a>').join(''):'<span class="gap">gap — no ticket</span>';}

function init(){
  document.getElementById("meta").textContent="Live status · Jira project DIF · generated "+DATA.meta.generated+" · no tickets created for this tracker";
  document.getElementById("foot").textContent="Status flow: Planning → Scoping → In Progress → In Review → Delivered. Underlined text = problem to be solved.";
  const items=DATA.asks.flatMap(a=>a.items),c={};ORD.forEach(s=>c[s]=0);items.forEach(i=>c[i.status]++);
  document.getElementById("chips").innerHTML=ORD.map(s=>pill(s)+' <b style="margin:0 8px 0 -2px">'+c[s]+'</b>').join('');
  const fs=document.getElementById("fs");ORD.forEach(s=>fs.innerHTML+='<option value="'+s+'">'+L[s]+'</option>');
  const fa=document.getElementById("fa");DATA.asks.forEach(a=>fa.innerHTML+='<option value="'+a.id+'">'+a.id+' — '+a.title+'</option>');
  fs.onchange=fa.onchange=draw;document.getElementById("q").oninput=draw;
  draw();
}
function draw(){
  const st=document.getElementById("fs").value,ak=document.getElementById("fa").value,
        q=document.getElementById("q").value.toLowerCase().trim();
  const tb=document.getElementById("tb");tb.innerHTML="";let shown=0;
  DATA.asks.forEach(a=>{
    if(ak!=="all"&&a.id!==ak)return;
    let rows="";
    a.items.forEach(i=>{
      if(st!=="all"&&i.status!==st)return;
      const blob=(a.title+i.title+i.desc+i.oq+i.deps.join(" ")+i.tickets.join(" ")).toLowerCase();
      if(q&&!blob.includes(q))return;
      shown++;
      rows+='<tr><td class="id">'+i.id+'</td>'+
        '<td><div class="itemname">'+i.title+'</div><div class="sub">'+i.desc+'</div></td>'+
        '<td>'+pill(i.status)+'</td>'+
        '<td>'+tkts(i.tickets)+'</td>'+
        '<td class="dep">'+(i.deps.length?i.deps.join('; '):'—')+'</td>'+
        '<td class="oq">'+i.oq+'</td></tr>';
    });
    if(rows){
      tb.innerHTML+='<tr class="askrow"><td colspan="6"><div class="at">'+a.id+' — '+a.title+'</div>'+
        '<div class="pb"><b>Problem:</b> <u>'+a.problem+'</u></div></td></tr>'+rows;
    }
  });
  if(!shown)tb.innerHTML='<tr><td colspan="6" style="color:#9aa3b2;font-style:italic">No items match.</td></tr>';
}
</script>
</body>
</html>
