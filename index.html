<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RP / Explorer — Feedback Delivery Tracker</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1a1f2b;--muted:#616a78;--line:#e4e7ee;
    --plan:#8a94a6;--scope:#7c5cff;--prog:#2f80ed;--review:#e6892b;--done:#27ae60;--gap:#c0392b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;line-height:1.45}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 18px 50px}
  h1{margin:0;font-size:19px}
  .meta{color:var(--muted);font-size:12px;margin:3px 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff}
  .s-planning{background:var(--plan)}.s-scoping{background:var(--scope)}.s-in_progress{background:var(--prog)}
  .s-in_review{background:var(--review)}.s-delivered{background:var(--done)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 14px}
  select,input{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px}
  input#q{min-width:200px}
  .controls label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:8px 10px;vertical-align:top;border-bottom:1px solid var(--line)}
  th{background:#f0f2f6;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#4a5361;position:sticky;top:0}
  td.id{font-weight:700;color:var(--muted);white-space:nowrap}
  .askrow td{background:#eef1fb;border-top:2px solid #d7dcf3}
  .askrow .at{font-weight:700;font-size:13px}
  .askrow .pb{color:#40506e;font-size:12px;margin-top:2px}
  .askrow .pb u{text-decoration-color:#b9a9ff;text-decoration-thickness:2px;text-underline-offset:2px}
  .itemname{font-weight:650}
  .sub{color:var(--muted);font-size:12px}
  a.tkt{display:inline-block;font-size:11px;font-weight:700;text-decoration:none;color:#2f6fed;
    background:#eaf1ff;border:1px solid #d6e3ff;padding:1px 6px;border-radius:5px;margin:0 3px 3px 0}
  a.tkt:hover{background:#dbe8ff}
  .gap{color:var(--gap);font-style:italic;font-size:11px;font-weight:600}
  td.oq{color:#7a5a12}
  td.dep{color:#6b4a80}
  footer{color:var(--muted);font-size:11px;margin-top:14px;text-align:center}
  @media(max-width:820px){td.dep,th.dep{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>RP / Explorer — Feedback Delivery Tracker</h1>
  <div class="meta" id="meta"></div>
  <div class="chips" id="chips"></div>
  <div class="controls">
    <label>Status</label><select id="fs"><option value="all">All</option></select>
    <label>Ask</label><select id="fa"><option value="all">All</option></select>
    <input id="q" placeholder="Search text / ticket…"/>
  </div>
  <table>
    <thead><tr>
      <th>Item</th><th>Scope</th><th>Status</th><th>Jira</th>
      <th class="dep">Dependencies</th><th>Open question</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <footer id="foot"></footer>
</div>
<script>
const L={planning:"Planning",scoping:"Scoping",in_progress:"In Progress",in_review:"In Review",delivered:"Delivered"};
const ORD=["planning","scoping","in_progress","in_review","delivered"];
const JB="https://jira.frontiersin.net/browse/";
let DATA=null;
const DATA_INLINE={"meta": {"generated": "2026-08-03"}, "asks": [{"id": "A1", "title": "Available audience for journal/section, assigned to a team member", "problem": "Commissioning teams can't see how many contactable researchers exist for a given journal or section, nor split ownership across the team \u2014 so outreach is uncoordinated and audiences get double-worked or missed.", "items": [{"id": "1a", "title": "Audience count per journal / section", "desc": "Show count of contactable researchers for a journal or section.", "status": "in_progress", "tickets": ["DIF-1303", "DIF-1569"], "deps": ["Requires section filter (2a) to define the audience"], "oq": "Raw match count, or net of exclusions (opted-out, banned country)? Decides whether this depends on Ask 4."}, {"id": "1b", "title": "Assign audience to a team member", "desc": "Assign a batch or individual researcher to a named team member.", "status": "planning", "tickets": [], "deps": ["Blocked on 1a first"], "oq": "Does assignment live in Explorer or downstream in Salesforce? No Explorer ticket exists."}]}, {"id": "A2", "title": "Boolean operator and section filter", "problem": "Current filters are too blunt to build a precise target list \u2014 teams can't narrow to a section or combine criteria with AND/OR/NOT, producing noisy candidate lists.", "items": [{"id": "2a", "title": "Hierarchical journal \u2192 section filter", "desc": "Filter results by journal and its sections hierarchically.", "status": "scoping", "tickets": ["DIF-1303", "DIF-1529"], "deps": ["DIF-1303 is a placeholder pending PRD refinement"], "oq": "Single- or multi-section selection, and must it combine with 2b boolean logic?"}, {"id": "2b", "title": "Boolean operator across facets", "desc": "Combine filter criteria with AND / OR / NOT.", "status": "in_review", "tickets": ["DIF-1495"], "deps": ["DIF-1495 shipped must-have/must-not, but only for editorial-role engagement"], "oq": "General operator across ALL facets, or is the shipped engagement model enough? Full generalization is new scope."}]}, {"id": "A3", "title": "Option to run a manual campaign for junior researchers", "problem": "There is no way to deliberately target early-career researchers \u2014 an under-served, high-potential segment \u2014 for outreach.", "items": [{"id": "3a", "title": "Define the 'junior researcher' segment", "desc": "Career-stage facet identifying early-career researchers.", "status": "planning", "tickets": [], "deps": ["No career-stage facet in RPS/Explorer today"], "oq": "What defines 'junior' \u2014 years since first pub, title, h-index band, or explicit field?"}, {"id": "3b", "title": "Manually trigger the campaign", "desc": "Manual action to launch outreach to the segment.", "status": "planning", "tickets": [], "deps": ["Depends on 3a"], "oq": "Runs in Explorer, or Explorer builds the audience and hands off to Salesforce/Marketing Cloud?"}]}, {"id": "A4", "title": "Show why researchers are excluded, by reason", "problem": "When researchers drop out of a list, teams don't know why \u2014 integrity flag vs opted-out vs unavailable \u2014 so they can't trust the audience or act on fixable exclusions.", "items": [{"id": "4a", "title": "Integrity / eligibility exclusions", "desc": "Retractions, PubPeer, watchlist, banned country, with green/red verdict.", "status": "in_progress", "tickets": ["DIF-1502", "DIF-1503", "DIF-1504", "DIF-1505", "DIF-1513", "DIF-1509", "DIF-1554"], "deps": ["DIF-1505 blocked on DIF-1513 (RPS Metrics API, To-Do) \u2014 critical path"], "oq": "Per-researcher verdict only, or also aggregated ('X of Y excluded, by reason')?"}, {"id": "4b", "title": "Contactability exclusions", "desc": "Opt-out / unsubscribed / availability status.", "status": "scoping", "tickets": ["DIF-1559", "DIF-1549", "DIF-1569"], "deps": ["Depends on EmailUnsubscribed ingestion (DIF-1559, DIF-1549)"], "oq": "Same feature as 4a or a separate view? Different sources and owners."}]}, {"id": "A5", "title": "Select what type of search to run: full profile, publications, conference", "problem": "Search always runs against the full profile, so teams can't target specifically on recent publications or conference activity \u2014 diluting relevance.", "items": [{"id": "5a", "title": "Backend data per search type", "desc": "Searchable data exists for publications and conference content.", "status": "delivered", "tickets": ["DIF-1319", "DIF-1416"], "deps": [], "oq": "None \u2014 conference ingestion and conference full-text fields are Done."}, {"id": "5b", "title": "Search-type selector UI", "desc": "Toggle to scope search to full profile, publications, or conference.", "status": "planning", "tickets": [], "deps": ["Backend (5a) ready; front-end/UX gap"], "oq": "Which types exactly, and full-text, semantic, or both per type?"}]}]};
DATA=DATA_INLINE;
window.addEventListener("DOMContentLoaded",init);

function pill(s){return '<span class="pill s-'+s+'">'+L[s]+'</span>';}
function tkts(a){return a.length?a.map(t=>'<a class="tkt" target="_blank" href="'+JB+t+'">'+t+'</a>').join(''):'<span class="gap">gap — no ticket</span>';}

function init(){
  document.getElementById("meta").textContent="Live status · Jira project DIF · generated "+DATA.meta.generated+" · no tickets created for this tracker";
  document.getElementById("foot").textContent="Status flow: Planning → Scoping → In Progress → In Review → Delivered. Underlined text = problem to be solved.";
  const items=DATA.asks.flatMap(a=>a.items),c={};ORD.forEach(s=>c[s]=0);items.forEach(i=>c[i.status]++);
  document.getElementById("chips").innerHTML=ORD.map(s=>pill(s)+' <b style="margin:0 8px 0 -2px">'+c[s]+'</b>').join('');
  const fs=document.getElementById("fs");ORD.forEach(s=>fs.innerHTML+='<option value="'+s+'">'+L[s]+'</option>');
  const fa=document.getElementById("fa");DATA.asks.forEach(a=>fa.innerHTML+='<option value="'+a.id+'">'+a.id+' — '+a.title+'</option>');
  fs.onchange=fa.onchange=draw;document.getElementById("q").oninput=draw;
  draw();
}
function draw(){
  const st=document.getElementById("fs").value,ak=document.getElementById("fa").value,
        q=document.getElementById("q").value.toLowerCase().trim();
  const tb=document.getElementById("tb");tb.innerHTML="";let shown=0;
  DATA.asks.forEach(a=>{
    if(ak!=="all"&&a.id!==ak)return;
    let rows="";
    a.items.forEach(i=>{
      if(st!=="all"&&i.status!==st)return;
      const blob=(a.title+i.title+i.desc+i.oq+i.deps.join(" ")+i.tickets.join(" ")).toLowerCase();
      if(q&&!blob.includes(q))return;
      shown++;
      rows+='<tr><td class="id">'+i.id+'</td>'+
        '<td><div class="itemname">'+i.title+'</div><div class="sub">'+i.desc+'</div></td>'+
        '<td>'+pill(i.status)+'</td>'+
        '<td>'+tkts(i.tickets)+'</td>'+
        '<td class="dep">'+(i.deps.length?i.deps.join('; '):'—')+'</td>'+
        '<td class="oq">'+i.oq+'</td></tr>';
    });
    if(rows){
      tb.innerHTML+='<tr class="askrow"><td colspan="6"><div class="at">'+a.id+' — '+a.title+'</div>'+
        '<div class="pb"><b>Problem:</b> <u>'+a.problem+'</u></div></td></tr>'+rows;
    }
  });
  if(!shown)tb.innerHTML='<tr><td colspan="6" style="color:#9aa3b2;font-style:italic">No items match.</td></tr>';
}
</script>
</body>
</html>
